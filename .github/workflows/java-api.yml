name: Java API Tests

on:
  push:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      test_group:
        description: 'Test group'
        required: true
        default: 'regression'
        type: choice
        options:
          - smoke
          - regression

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: java-api/pom.xml

      - name: Run API tests
        run: |
          cd java-api
          if [ "${{ github.event.inputs.test_group }}" = "smoke" ]; then
            mvn -B test -Dgroups=smoke
          else
            mvn -B test -Dgroups=regression
          fi

      - name: Load previous report history
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git fetch origin gh-pages-src
          git worktree add pages-src origin/gh-pages-src
          mkdir -p java-api/allure-results/history
          if [ -d pages-src/java-api/history ]; then
            cp -r pages-src/java-api/history/. java-api/allure-results/history/
          fi
          echo "History files loaded: $(ls java-api/allure-results/history | wc -l) of 5"

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
          allure generate java-api/allure-results --clean -o java-api/allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-api-allure-report
          path: java-api/allure-report

      - name: Publish Java API report to combined site branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          rm -rf pages-src/java-api
          mkdir -p pages-src/java-api
          cp -r java-api/allure-report/* pages-src/java-api/
          cd pages-src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add java-api
          git commit -m "chore: update java api allure report [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:gh-pages-src || (git pull --rebase origin gh-pages-src && git push origin HEAD:gh-pages-src)

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-src

  deploy:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4